<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevHawk | Your Developer Mirror</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: white; }
        .glass { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); }
        .timer-circle { width: 300px; height: 300px; border-radius: 50%; border: 8px solid #1e293b; display: flex; align-items: center; justify-content: center; position: relative; transition: border-color 0.5s; }
        .timer-circle.active { border-color: #3b82f6; box-shadow: 0 0 40px rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body class="min-h-screen">

    <nav class="p-6 flex justify-between items-center max-w-6xl mx-auto">
        <h1 class="text-2xl font-800 tracking-tighter">DEV<span class="text-blue-500">HAWK</span></h1>
        <div class="glass px-2 py-1 rounded-2xl flex gap-1">
            <button onclick="showTab('dash')" class="px-6 py-2 rounded-xl text-sm font-bold transition-all hover:bg-white/5">Dashboard</button>
            <button onclick="showTab('focus')" class="px-6 py-2 rounded-xl text-sm font-bold transition-all hover:bg-white/5 bg-blue-600 text-white">Focus</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-8">
        
        <div id="tab-dash" class="hidden animate-in fade-in duration-500">
            <section class="text-center mb-12">
                <h2 class="text-5xl font-extrabold mb-6">Mirror Your Stats.</h2>
                <div class="flex max-w-md mx-auto gap-2 p-2 glass rounded-2xl">
                    <input id="gh-user" type="text" placeholder="GitHub Username" class="bg-transparent border-none focus:ring-0 flex-1 px-4">
                    <button onclick="fetchStats()" class="bg-blue-600 px-6 py-2 rounded-xl font-bold">Sync</button>
                </div>
            </section>

            <div id="gh-card" class="glass p-8 rounded-[2.5rem] hidden">
                <div class="flex items-center gap-6 mb-8">
                    <img id="gh-avatar" src="" class="w-24 h-24 rounded-3xl border-4 border-blue-500 shadow-2xl">
                    <div>
                        <h3 id="gh-name" class="text-3xl font-bold">Developer</h3>
                        <p class="text-blue-400 font-bold">Active Contributor</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-900/80 p-6 rounded-3xl border border-white/5">
                        <p class="text-slate-500 text-xs uppercase tracking-widest mb-2">Public Repos</p>
                        <p id="gh-repos" class="text-3xl font-black">0</p>
                    </div>
                    <div class="bg-slate-900/80 p-6 rounded-3xl border border-white/5">
                        <p class="text-slate-500 text-xs uppercase tracking-widest mb-2">Followers</p>
                        <p id="gh-followers" class="text-3xl font-black">0</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab-focus" class="flex flex-col items-center animate-in fade-in duration-500">
            <h2 class="text-2xl font-bold mb-10 text-slate-400">Deep Work Engine</h2>
            
            <div id="circle" class="timer-circle mb-12">
                <span id="display" class="text-7xl font-black tracking-tighter">25:00</span>
            </div>

            <div class="flex gap-4 mb-12">
                <button onclick="setTime(25)" class="glass px-6 py-2 rounded-full text-sm hover:border-blue-500">25m</button>
                <button onclick="setTime(30)" class="glass px-6 py-2 rounded-full text-sm hover:border-blue-500">30m</button>
                <button onclick="setTime(45)" class="glass px-6 py-2 rounded-full text-sm hover:border-blue-500">45m</button>
                <input id="custom-time" type="number" placeholder="Min" class="glass w-16 px-2 py-2 rounded-full text-center text-sm">
            </div>

            <button id="main-btn" onclick="toggleTimer()" class="w-64 py-5 bg-blue-600 rounded-3xl font-black text-xl shadow-xl shadow-blue-600/20 hover:scale-105 transition">START FOCUS</button>
        </div>

    </main>

    <script>
        // --- Tab Logic ---
        function showTab(tab) {
            document.getElementById('tab-dash').classList.add('hidden');
            document.getElementById('tab-focus').classList.add('hidden');
            document.getElementById('tab-' + tab).classList.remove('hidden');
        }

        // --- Timer Logic ---
        let seconds = 25 * 60;
        let timer = null;

        function setTime(mins) {
            seconds = mins * 60;
            updateDisplay();
        }

        function updateDisplay() {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            document.getElementById('display').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function toggleTimer() {
            const btn = document.getElementById('main-btn');
            const circle = document.getElementById('circle');
            const custom = document.getElementById('custom-time').value;
            
            if (custom && !timer) seconds = custom * 60;

            if (timer) {
                clearInterval(timer);
                timer = null;
                btn.innerText = "START FOCUS";
                circle.classList.remove('active');
            } else {
                btn.innerText = "PAUSE";
                circle.classList.add('active');
                timer = setInterval(() => {
                    seconds--;
                    updateDisplay();
                    if (seconds <= 0) {
                        clearInterval(timer);
                        alert("Session Done!");
                    }
                }, 1000);
            }
        }

        // --- GitHub Logic ---
        async function fetchStats() {
            const user = document.getElementById('gh-user').value;
            const res = await fetch(`https://api.github.com/users/${user}`);
            const data = await res.json();
            if (data.login) {
                document.getElementById('gh-card').classList.remove('hidden');
                document.getElementById('gh-avatar').src = data.avatar_url;
                document.getElementById('gh-name').innerText = data.name || data.login;
                document.getElementById('gh-repos').innerText = data.public_repos;
                document.getElementById('gh-followers').innerText = data.followers;
            }
        }
    </script>
</body>
</html>
