<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevHawk | Your Developer Mirror</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: white; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); }
        .timer-circle { width: 260px; height: 260px; border-radius: 50%; border: 6px solid #1e293b; display: flex; align-items: center; justify-content: center; position: relative; transition: all 0.5s; }
        .timer-circle.active { border-color: #3b82f6; box-shadow: 0 0 30px rgba(59, 130, 246, 0.3); }
        /* Mobile Scrollbar Hide */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen pb-24 md:pb-0">

    <div class="sticky top-0 z-50 p-4 glass border-b border-white/5 mb-4">
        <div class="max-w-xl mx-auto flex gap-2">
            <input id="global-search" type="text" placeholder="Search any developer..." class="bg-slate-900/50 border border-white/10 rounded-xl flex-1 px-4 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <button onclick="handleSearch()" class="bg-blue-600 px-4 py-2 rounded-xl text-sm font-bold">Search</button>
        </div>
    </div>

    <main class="max-w-4xl mx-auto px-4 md:px-8">
        
        <div id="tab-dash" class="space-y-8 animate-in fade-in duration-500">
            <header class="text-left pt-4">
                <h2 class="text-3xl font-extrabold text-white">Your Mirror</h2>
                <p class="text-slate-500 text-sm">Personal accounts saved to this device.</p>
            </header>

            <div id="saved-area" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div onclick="promptAdd('github')" class="glass p-6 rounded-3xl border-dashed border-2 border-white/10 flex flex-col items-center justify-center text-slate-500 cursor-pointer hover:border-blue-500 transition">
                    <span class="text-2xl mb-2">+</span>
                    <p class="text-xs font-bold uppercase">Link GitHub</p>
                </div>
                <div onclick="promptAdd('leetcode')" class="glass p-6 rounded-3xl border-dashed border-2 border-white/10 flex flex-col items-center justify-center text-slate-500 cursor-pointer hover:border-yellow-500 transition">
                    <span class="text-2xl mb-2">+</span>
                    <p class="text-xs font-bold uppercase">Link LeetCode</p>
                </div>
            </div>

            <div id="result-card" class="glass p-6 rounded-3xl hidden border-l-4 border-blue-500 mt-8">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <img id="res-avatar" src="" class="w-14 h-14 rounded-xl">
                        <div>
                            <h3 id="res-name" class="font-bold text-lg"></h3>
                            <p id="res-type" class="text-xs text-blue-400 font-bold uppercase"></p>
                        </div>
                    </div>
                    <button onclick="closeResult()" class="text-slate-500 text-xl">×</button>
                </div>
            </div>
        </div>

        <div id="tab-focus" class="hidden flex flex-col items-center pt-10">
            <div id="circle" class="timer-circle mb-8">
                <span id="display" class="text-6xl font-black">25:00</span>
            </div>
            <div class="flex gap-2 mb-8 overflow-x-auto w-full justify-center">
                <button onclick="setTime(25)" class="glass px-5 py-2 rounded-full text-xs">25m</button>
                <button onclick="setTime(45)" class="glass px-5 py-2 rounded-full text-xs">45m</button>
                <button onclick="setTime(60)" class="glass px-5 py-2 rounded-full text-xs">60m</button>
            </div>
            <button id="main-btn" onclick="toggleTimer()" class="w-full max-w-xs py-4 bg-blue-600 rounded-2xl font-black text-lg">START FOCUS</button>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 p-4 glass border-t border-white/5 flex justify-around md:hidden">
        <button onclick="showTab('dash')" class="flex flex-col items-center gap-1">
            <span class="text-xs font-bold">Dashboard</span>
        </button>
        <button onclick="showTab('focus')" class="flex flex-col items-center gap-1">
            <span class="text-xs font-bold">Focus</span>
        </button>
    </nav>

    <script>
        // --- Persistence Logic ---
        window.onload = () => {
            const savedGH = localStorage.getItem('my-github');
            if(savedGH) renderSaved('github', savedGH);
            showTab('dash');
        }

        function promptAdd(type) {
            const user = prompt(`Enter your ${type} username to link:`);
            if(user) {
                localStorage.setItem(`my-${type}`, user);
                location.reload();
            }
        }

        // --- Search Logic ---
        async function handleSearch() {
            const user = document.getElementById('global-search').value;
            if(!user) return;
            const res = await fetch(`https://api.github.com/users/${user}`);
            const data = await res.json();
            if(data.login) {
                document.getElementById('result-card').classList.remove('hidden');
                document.getElementById('res-avatar').src = data.avatar_url;
                document.getElementById('res-name').innerText = data.name || data.login;
                document.getElementById('res-type').innerText = "GitHub Found";
            }
        }

        function closeResult() { document.getElementById('result-card').classList.add('hidden'); }

        function showTab(tab) {
            document.getElementById('tab-dash').classList.toggle('hidden', tab !== 'dash');
            document.getElementById('tab-focus').classList.toggle('hidden', tab !== 'focus');
        }

        // --- Timer Logic (Simplified for brevity) ---
        let sec = 1500; let t = null;
        function setTime(m) { sec = m*60; update(); }
        function update() { 
            const m = Math.floor(sec/60); const s = sec%60;
            document.getElementById('display').innerText = `${m}:${s<10?'0':''}${s}`;
        }
        function toggleTimer() {
            if(t) { clearInterval(t); t=null; }
            else { t=setInterval(()=>{sec--; update(); if(sec<=0)clearInterval(t)},1000); }
        }
    </script>
</body>
</html>
