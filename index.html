<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevHawk | Your Developer Mirror</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: white; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); }
        .timer-circle { width: 260px; height: 260px; border-radius: 50%; border: 6px solid #1e293b; display: flex; align-items: center; justify-content: center; position: relative; transition: all 0.5s; }
        .timer-circle.active { border-color: #3b82f6; box-shadow: 0 0 30px rgba(59, 130, 246, 0.3); }
        ::-webkit-scrollbar { display: none; }
        /* Image invert for dark mode chart */
        .gh-chart { filter: hue-rotate(180deg) invert(1) opacity(0.8); } 
    </style>
</head>
<body class="min-h-screen pb-24 md:pb-0">

    <nav class="p-6 flex justify-between items-center max-w-6xl mx-auto">
        <h1 class="text-2xl font-800 tracking-tighter text-white">DEV<span class="text-blue-500">HAWK</span></h1>
        
        <div class="glass px-2 py-1 rounded-2xl hidden md:flex gap-1 z-50">
            <button onclick="showTab('dash')" id="btn-dash" class="px-6 py-2 rounded-xl text-sm font-bold transition-all bg-white/10 hover:bg-white/20">Dashboard</button>
            <button onclick="showTab('pomo')" id="btn-pomo" class="px-6 py-2 rounded-xl text-sm font-bold transition-all hover:bg-white/20">Pomodoro</button>
            <button onclick="showTab('compare')" id="btn-compare" class="px-6 py-2 rounded-xl text-sm font-bold transition-all hover:bg-white/20 text-purple-400">Compare</button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 md:px-8 mt-4">
        
        <div id="tab-dash" class="space-y-8 animate-in fade-in duration-500">
            
            <div class="glass p-4 rounded-2xl flex gap-2">
                <input id="global-search" type="text" placeholder="Search any developer's GitHub..." class="bg-slate-900/50 border border-white/10 rounded-xl flex-1 px-4 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <button onclick="handleSearch()" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-xl text-sm font-bold transition">Search</button>
            </div>

            <header class="text-center pt-4 mb-4">
                <h2 class="text-4xl font-extrabold text-white">Your Mirror</h2>
            </header>

            <div id="my-profile-card" class="glass p-8 rounded-3xl hidden border-t-4 border-blue-500">
                <div class="flex flex-col md:flex-row items-center gap-6 mb-6">
                    <img id="my-avatar" src="" class="w-20 h-20 rounded-2xl border-2 border-blue-500">
                    <div class="text-center md:text-left">
                        <h3 id="my-name" class="font-bold text-3xl text-white"></h3>
                        <button onclick="unlinkAccount()" class="text-xs text-red-400 hover:underline mt-1">Unlink Account</button>
                    </div>
                    <div class="flex gap-4 ml-auto">
                        <div class="bg-slate-900/80 p-4 rounded-xl text-center min-w-[100px]">
                            <p class="text-slate-500 text-xs font-bold uppercase mb-1">Repos</p>
                            <p id="my-repos" class="text-xl font-black text-white">0</p>
                        </div>
                        <div class="bg-slate-900/80 p-4 rounded-xl text-center min-w-[100px]">
                            <p class="text-slate-500 text-xs font-bold uppercase mb-1">Followers</p>
                            <p id="my-followers" class="text-xl font-black text-white">0</p>
                        </div>
                    </div>
                </div>
                <div class="bg-slate-900/80 p-4 rounded-2xl overflow-hidden w-full overflow-x-auto">
                    <p class="text-slate-500 text-xs font-bold uppercase mb-2">GitHub Contributions</p>
                    <img id="my-chart" src="" alt="Contributions" class="gh-chart min-w-[700px]">
                </div>
            </div>

            <div id="link-area" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div onclick="promptAdd('github')" class="glass p-8 rounded-3xl border-dashed border-2 border-white/10 flex flex-col items-center justify-center text-slate-500 cursor-pointer hover:border-blue-500 hover:text-blue-400 transition">
                    <span class="text-4xl mb-2">+</span>
                    <p class="text-sm font-bold uppercase tracking-widest">Link GitHub</p>
                </div>
                <div onclick="alert('LeetCode API proxy coming in Phase 2!')" class="glass p-8 rounded-3xl border-dashed border-2 border-white/10 flex flex-col items-center justify-center text-slate-500 cursor-pointer hover:border-yellow-500 hover:text-yellow-400 transition">
                    <span class="text-4xl mb-2">+</span>
                    <p class="text-sm font-bold uppercase tracking-widest">Link LeetCode</p>
                </div>
            </div>
            
            <div id="result-card" class="glass p-6 rounded-3xl hidden border-l-4 border-blue-500 mt-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <img id="res-avatar" src="" class="w-16 h-16 rounded-xl border-2 border-blue-500">
                        <div>
                            <h3 id="res-name" class="font-bold text-xl text-white"></h3>
                            <p class="text-xs text-blue-400 font-bold uppercase tracking-widest">Profile Found</p>
                        </div>
                    </div>
                    <button onclick="closeResult()" class="text-slate-500 text-3xl hover:text-white">&times;</button>
                </div>
            </div>
        </div>

        <div id="tab-pomo" class="hidden flex flex-col items-center pt-10 animate-in fade-in duration-500">
            <h2 class="text-4xl font-extrabold mb-8 text-white">Pomodoro Clock</h2>
            <div id="circle" class="timer-circle mb-8">
                <span id="display" class="text-6xl font-black text-white">25:00</span>
            </div>
            <div class="flex flex-wrap gap-4 mb-10 justify-center max-w-md">
                <button onclick="setTime(25)" class="glass px-6 py-2 rounded-full text-sm font-bold hover:border-blue-500 transition">25m</button>
                <button onclick="setTime(45)" class="glass px-6 py-2 rounded-full text-sm font-bold hover:border-blue-500 transition">45m</button>
                <div class="flex items-center glass rounded-full overflow-hidden focus-within:border-blue-500 border border-transparent">
                    <input id="custom-min" type="number" placeholder="Custom" class="w-20 bg-transparent text-center text-sm py-2 outline-none">
                    <button onclick="setCustom()" class="bg-blue-600 px-4 py-2 text-sm font-bold hover:bg-blue-500">Set</button>
                </div>
            </div>
            <button id="main-btn" onclick="toggleTimer()" class="w-full max-w-md py-4 bg-blue-600 rounded-2xl font-black text-xl hover:bg-blue-500 hover:scale-105 transition-all shadow-lg shadow-blue-600/20">START FOCUS</button>
        </div>

        <div id="tab-compare" class="hidden animate-in fade-in duration-500">
            <header class="text-center pt-4 mb-8">
                <h2 class="text-4xl font-extrabold text-white">Developer Battle</h2>
                <p class="text-slate-400 mt-2">Compare GitHub Stats</p>
            </header>
            
            <div class="flex flex-col md:flex-row gap-4 items-center justify-center mb-8">
                <input id="user1" type="text" placeholder="Username 1" class="glass px-4 py-3 rounded-xl text-center w-full md:w-64 focus:border-purple-500 outline-none">
                <span class="text-2xl font-black text-purple-500">VS</span>
                <input id="user2" type="text" placeholder="Username 2" class="glass px-4 py-3 rounded-xl text-center w-full md:w-64 focus:border-purple-500 outline-none">
            </div>
            <div class="text-center mb-8">
                <button onclick="compareUsers()" class="bg-purple-600 hover:bg-purple-500 px-8 py-3 rounded-xl font-black text-lg transition shadow-lg shadow-purple-600/20">COMPARE NOW</button>
            </div>

            <div id="compare-results" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
                <div class="glass p-6 rounded-3xl border-t-4 border-blue-500 text-center">
                    <img id="c1-avatar" src="" class="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-slate-800">
                    <h3 id="c1-name" class="text-2xl font-bold mb-4"></h3>
                    <div class="flex justify-between bg-slate-900/50 p-4 rounded-xl mb-2">
                        <span class="text-slate-400 font-bold">Repos</span>
                        <span id="c1-repos" class="font-black text-white"></span>
                    </div>
                    <div class="flex justify-between bg-slate-900/50 p-4 rounded-xl">
                        <span class="text-slate-400 font-bold">Followers</span>
                        <span id="c1-followers" class="font-black text-white"></span>
                    </div>
                </div>
                <div class="glass p-6 rounded-3xl border-t-4 border-purple-500 text-center">
                    <img id="c2-avatar" src="" class="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-slate-800">
                    <h3 id="c2-name" class="text-2xl font-bold mb-4"></h3>
                    <div class="flex justify-between bg-slate-900/50 p-4 rounded-xl mb-2">
                        <span class="text-slate-400 font-bold">Repos</span>
                        <span id="c2-repos" class="font-black text-white"></span>
                    </div>
                    <div class="flex justify-between bg-slate-900/50 p-4 rounded-xl">
                        <span class="text-slate-400 font-bold">Followers</span>
                        <span id="c2-followers" class="font-black text-white"></span>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 p-4 glass border-t border-white/5 flex justify-around md:hidden z-50">
        <button onclick="showTab('dash')" class="flex flex-col items-center gap-1">
            <span class="text-xs font-bold uppercase tracking-widest">Dash</span>
        </button>
        <button onclick="showTab('pomo')" class="flex flex-col items-center gap-1">
            <span class="text-xs font-bold uppercase tracking-widest">Pomodoro</span>
        </button>
        <button onclick="showTab('compare')" class="flex flex-col items-center gap-1 text-purple-400">
            <span class="text-xs font-bold uppercase tracking-widest">Compare</span>
        </button>
    </nav>

    <script>
        // --- On Load: Check if GitHub is Linked ---
        window.onload = async () => {
            const savedGH = localStorage.getItem('my-github');
            if(savedGH) {
                document.getElementById('link-area').classList.add('hidden');
                document.getElementById('my-profile-card').classList.remove('hidden');
                
                // Fetch basic stats
                const res = await fetch(`https://api.github.com/users/${savedGH}`);
                const data = await res.json();
                if(data.login) {
                    document.getElementById('my-avatar').src = data.avatar_url;
                    document.getElementById('my-name').innerText = data.name || data.login;
                    document.getElementById('my-repos').innerText = data.public_repos;
                    document.getElementById('my-followers').innerText = data.followers;
                    // Hackathon API Trick: Third party contribution chart generator
                    document.getElementById('my-chart').src = `https://ghchart.rshah.org/${savedGH}`;
                }
            }
        }

        // --- Tab Switching Logic ---
        function showTab(tab) {
            ['dash', 'pomo', 'compare'].forEach(t => {
                document.getElementById('tab-'+t).classList.add('hidden');
                document.getElementById('btn-'+t)?.classList.remove('bg-white/10');
            });
            document.getElementById('tab-'+tab).classList.remove('hidden');
            document.getElementById('btn-'+tab)?.classList.add('bg-white/10');
        }

        // --- Link & Search Logic ---
        function promptAdd(type) {
            if(type === 'github') {
                const user = prompt(`Enter your GitHub username to link permanently:`);
                if(user) { localStorage.setItem('my-github', user); location.reload(); }
            }
        }
        function unlinkAccount() { localStorage.removeItem('my-github'); location.reload(); }

        async function handleSearch() {
            const user = document.getElementById('global-search').value;
            if(!user) return;
            const res = await fetch(`https://api.github.com/users/${user}`);
            const data = await res.json();
            if(data.login) {
                document.getElementById('result-card').classList.remove('hidden');
                document.getElementById('res-avatar').src = data.avatar_url;
                document.getElementById('res-name').innerText = data.name || data.login;
            }
        }
        function closeResult() { document.getElementById('result-card').classList.add('hidden'); }

        // --- Pomodoro Timer Logic ---
        let sec = 1500; let t = null;
        function setTime(m) { sec = m*60; update(); }
        function setCustom() {
            const val = document.getElementById('custom-min').value;
            if(val && val > 0) { setTime(val); }
        }
        function update() { 
            const m = Math.floor(sec/60); const s = sec%60;
            document.getElementById('display').innerText = `${m}:${s<10?'0':''}${s}`;
        }
        function toggleTimer() {
            const btn = document.getElementById('main-btn');
            const circle = document.getElementById('circle');
            if(t) { 
                clearInterval(t); t=null; 
                btn.innerText="START FOCUS"; circle.classList.remove('active');
            } else { 
                t=setInterval(()=>{sec--; update(); if(sec<=0)clearInterval(t)},1000); 
                btn.innerText="PAUSE"; circle.classList.add('active');
            }
        }

        // --- Compare Users Logic ---
        async function compareUsers() {
            const u1 = document.getElementById('user1').value;
            const u2 = document.getElementById('user2').value;
            if(!u1 || !u2) return alert("Enter both usernames!");

            document.getElementById('compare-results').classList.remove('hidden');

            // Fetch User 1
            fetch(`https://api.github.com/users/${u1}`).then(r=>r.json()).then(d1 => {
                document.getElementById('c1-avatar').src = d1.avatar_url || '';
                document.getElementById('c1-name').innerText = d1.login || 'N/A';
                document.getElementById('c1-repos').innerText = d1.public_repos || '0';
                document.getElementById('c1-followers').innerText = d1.followers || '0';
            });
            // Fetch User 2
            fetch(`https://api.github.com/users/${u2}`).then(r=>r.json()).then(d2 => {
                document.getElementById('c2-avatar').src = d2.avatar_url || '';
                document.getElementById('c2-name').innerText = d2.login || 'N/A';
                document.getElementById('c2-repos').innerText = d2.public_repos || '0';
                document.getElementById('c2-followers').innerText = d2.followers || '0';
            });
        }
    </script>
</body>
</html>
